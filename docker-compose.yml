services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cyonima}
      POSTGRES_USER: ${POSTGRES_USER:-cyonima}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cyonima}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cyonima}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
    # Uncomment to enable GPU passthrough
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      SANDBOX_VOLUME_ROOT: /sandbox/workspaces
      USE_SQLITE: "false"
      USE_IN_MEMORY_CHANNEL: "false"
    user: "${SANDBOX_UID:-1000}:${SANDBOX_GID:-1000}"
    volumes:
      - ./backend:/app
      - ./sandbox/workspaces:/sandbox/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -l info
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      SANDBOX_VOLUME_ROOT: /sandbox/workspaces
      USE_SQLITE: "false"
      USE_IN_MEMORY_CHANNEL: "false"
    user: "${SANDBOX_UID:-1000}:${SANDBOX_GID:-1000}"
    volumes:
      - ./backend:/app
      - ./sandbox/workspaces:/sandbox/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

  agent-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: celery -A config worker -Q agents --concurrency=4 -l info
    env_file: .env
    environment:
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      SANDBOX_VOLUME_ROOT: /sandbox/workspaces
      USE_SQLITE: "false"
      USE_IN_MEMORY_CHANNEL: "false"
    user: "${SANDBOX_UID:-1000}:${SANDBOX_GID:-1000}"
    volumes:
      - ./backend:/app
      - ./sandbox/workspaces:/sandbox/workspaces
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  pgdata:
  ollama:
